name: Auf GitHub Pages veröffentlichen

# Baut die Site bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Der Build bricht bei defekten internen Links ab (onBrokenLinks: 'throw'), ein
# kaputter Link kommt also gar nicht erst online.
#
# Einmalige Einrichtung: Settings -> Pages -> Source auf "GitHub Actions".
#
# Custom Domain (dok.smart-me.com): eine Datei `static/CNAME` mit der Domain als
# einzigem Inhalt anlegen und unten SITE_URL/BASE_URL entsprechend setzen:
#   SITE_URL: https://dok.smart-me.com
#   BASE_URL: /

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Wo gebaut wird. auto prüft den Self-hosted-Runner und weicht sonst auf GitHub aus.'
        type: choice
        default: auto
        options:
          - auto
          - self-hosted
          - github-hosted

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen, aber auch nicht überholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Wählt den Runner: Self-hosted, wenn der Scale Set erreichbar und frei ist,
  # sonst GitHub-hosted. Siehe .github/workflows/pick-runner.yml.
  pick-runner:
    name: Runner wählen
    uses: ./.github/workflows/pick-runner.yml
    permissions:
      issues: write
    with:
      forced-runner: ${{ inputs.runner || 'auto' }}
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  build:
    needs: pick-runner
    if: ${{ !cancelled() }}
    # Ein erneuter Anlauf läuft bewusst auf GitHub-hosted: Wiederholt man einen
    # Lauf, liegt es oft am Runner selbst.
    runs-on: ${{ fromJSON(github.run_attempt) > 1 && 'ubuntu-24.04' || needs.pick-runner.outputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Docusaurus zeigt das Datum der letzten Änderung je Seite an und
          # braucht dafür die vollständige Historie.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Die Bildpfade unter i18n/ werden aus dem Ordnerinhalt abgeleitet, nicht
      # von Hand gepflegt. Wird eine Sprachvariante gelöscht, zeigt die
      # Übersetzung noch auf die verschwundene Datei und der Build bräche ab.
      # Dieser Schritt setzt die Verweise vorher wieder gerade – im Checkout des
      # Runners, nicht im Repository. Den dauerhaften Stand zieht der
      # Übersetzungs-Workflow nach, der ebenfalls auf static/img/** reagiert.
      - name: Bildvarianten abgleichen
        run: npm run translate:images
 
      - name: Build (alle Sprachen)
        run: npm run build
        env:
          SITE_URL: https://ecarup.github.io
          BASE_URL: /smart-me-wiki/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  # Das Veröffentlichen selbst ist nur ein API-Aufruf und bleibt bei GitHub.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
