name: Auf GitHub Pages veröffentlichen

# Baut die Site bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Der Build bricht bei defekten internen Links ab (onBrokenLinks: 'throw'), ein
# kaputter Link kommt also gar nicht erst online.
#
# Einmalige Einrichtung: Settings -> Pages -> Source auf "GitHub Actions".
#
# Custom Domain: wiki.smart-me.com. Sie wird unter Settings -> Pages -> Custom
# domain eingetragen. Eine Datei `static/CNAME` braucht es nicht – beim
# Veröffentlichen über GitHub Actions wird sie von GitHub ignoriert.
# SITE_URL/BASE_URL unten müssen zur eingetragenen Domain passen.
#
# dok.smart-me.com und doc.smart-me.com leitet Cloudflare per 301 hierher um
# (doc.smart-me.com auf /en/…); die alten Pfade fängt redirects.ts ab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen, aber auch nicht überholen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Bewusst GitHub-hosted: Das Repository ist öffentlich, der Self-hosted-Runner
    # (eCarUp/west-orange-github-runner) nimmt keine Jobs öffentlicher Repos an,
    # und für öffentliche Repos sind GitHub-hosted-Runner ohnehin kostenlos.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Docusaurus zeigt das Datum der letzten Änderung je Seite an und
          # braucht dafür die vollständige Historie.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Die Bildpfade unter i18n/ werden aus dem Ordnerinhalt abgeleitet, nicht
      # von Hand gepflegt. Wird eine Sprachvariante gelöscht, zeigt die
      # Übersetzung noch auf die verschwundene Datei und der Build bräche ab.
      # Dieser Schritt setzt die Verweise vorher wieder gerade – im Checkout des
      # Runners, nicht im Repository. Den dauerhaften Stand zieht der
      # Übersetzungs-Workflow nach, der ebenfalls auf static/img/** reagiert.
      - name: Bildvarianten abgleichen
        run: npm run translate:images
 
      - name: Build (alle Sprachen)
        run: npm run build
        env:
          SITE_URL: https://wiki.smart-me.com
          BASE_URL: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
