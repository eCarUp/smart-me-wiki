---
name: Pick runner
# Plans where the jobs of the caller run. As many of them as the self-hosted runner scale set has free runners run
# there, the others on GitHub-hosted runners. When the scale set is offline an issue is opened, which notifies by
# email, and the next run that finds it online again closes the issue.
# Same as pick-runner.yml in eCarUp/ecarup-cloud, the runner setup is in eCarUp/west-orange-github-runner.
on:
  workflow_call:
    inputs:
      forced-runner:
        description: "auto, self-hosted or github-hosted"
        type: string
        default: auto
      shards:
        description: "Number of jobs the caller runs in parallel"
        type: number
        default: 1
    outputs:
      runner:
        description: "Label for runs-on of the first job, for callers with a single job"
        value: ${{ jobs.pick-runner.outputs.runner }}
      matrix:
        description: "JSON array with one {shard, runner} per job, for strategy.matrix.include"
        value: ${{ jobs.pick-runner.outputs.matrix }}
    secrets:
      RUNNER_STATUS_TOKEN:
        description: "Fine-grained PAT of the organization with 'Self-hosted runners: read'"
        required: false

jobs:
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      matrix: ${{ steps.pick.outputs.matrix }}
    env:
      SELF_HOSTED_LABEL: self-ubuntu-24.04
      GITHUB_HOSTED_LABEL: ubuntu-24.04
      # maxRunners of the scale set, see eCarUp/west-orange-github-runner
      MAX_RUNNERS: 8
      SHARDS: ${{ inputs.shards }}
      ISSUE_TITLE: "Self-hosted runner self-ubuntu-24.04 is offline, CI falls back to GitHub-hosted runners"
      ISSUE_ASSIGNEE: davideberli
    steps:
      - name: Check self-hosted runners
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORCED_RUNNER: ${{ inputs.forced-runner }}
        run: |
          # $1: number of shards that run on the self-hosted runner, the first ones of the matrix
          plan() {
            matrix=$(jq -cn --argjson n "$SHARDS" --argjson s "$1" \
              '[range($n) | {shard: ., runner: (if . < $s then env.SELF_HOSTED_LABEL else env.GITHUB_HOSTED_LABEL end)}]')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "runner=$(jq -r '.[0].runner' <<< "$matrix")" >> "$GITHUB_OUTPUT"
            echo "$1 of $SHARDS shards on the self-hosted runner: $matrix"
          }

          case "$FORCED_RUNNER" in
            self-hosted) plan "$SHARDS"; exit 0 ;;
            github-hosted) echo "::warning::GitHub-hosted runners requested by the workflow_dispatch input."; plan 0; exit 0 ;;
          esac

          offline=""
          if [ -z "$RUNNER_STATUS_TOKEN" ]; then
            offline="The secret RUNNER_STATUS_TOKEN is not available to this run."
          elif ! runners=$(GH_TOKEN="$RUNNER_STATUS_TOKEN" gh api --paginate orgs/${{ github.repository_owner }}/actions/runners \
              --jq ".runners[] | select(.status == \"online\" and ((.labels | map(.name) | index(\"$SELF_HOSTED_LABEL\")) or (.name | startswith(\"$SELF_HOSTED_LABEL-\")))) | \"\(.name) \(.busy)\"" 2>&1); then
            offline="Querying the organization runners failed: $runners"
          elif [ -z "$runners" ]; then
            offline="No runner of the scale set $SELF_HOSTED_LABEL is online."
          fi

          # A failing issue lookup must not fail the run, the issue is then left as it is.
          issue_lookup=ok
          open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty") || issue_lookup=failed

          if [ -n "$offline" ]; then
            echo "::warning::Falling back to GitHub-hosted runners. $offline"
            plan 0
            # Dependabot runs never see Actions secrets, so a missing token there is expected and no outage.
            if [ "$issue_lookup" = ok ] && [ -z "$open_issue" ] && [ "$GITHUB_ACTOR" != "dependabot[bot]" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$ISSUE_ASSIGNEE" --title "$ISSUE_TITLE" --body "$(printf '%s\n\n%s\n\n%s' \
                "$GITHUB_WORKFLOW of $RUN_URL ran on GitHub-hosted runners because the self-hosted runner could not be used." \
                "Reason: $offline" \
                "This issue is closed automatically by the next run that finds the self-hosted runner online again. Setup and troubleshooting: https://github.com/eCarUp/west-orange-github-runner")" \
                || echo "::warning::Opening the issue failed"
            fi
            exit 0
          fi

          if [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --repo "$GITHUB_REPOSITORY" --comment "The self-hosted runner is online again ($RUN_URL)." \
              || echo "::warning::Closing issue #$open_issue failed"
          fi

          # The scale set is shared with other repositories. Jobs beyond its maximum wait in the queue for an
          # unknown time, so only as many shards as there are free runners run there.
          echo "Online: $(echo "$runners" | tr '\n' ',')"
          busy=$(echo "$runners" | grep -c ' true$' || true)
          free=$((MAX_RUNNERS > busy ? MAX_RUNNERS - busy : 0))
          self_hosted=$((free < SHARDS ? free : SHARDS))
          if [ "$self_hosted" -lt "$SHARDS" ]; then
            echo "::warning::Only $free of $MAX_RUNNERS self-hosted runners are free, $((SHARDS - self_hosted)) of $SHARDS shards run on GitHub-hosted runners."
          fi
          plan "$self_hosted"
